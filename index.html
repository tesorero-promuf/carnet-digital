<title>Carnetización Digital · PROMUF</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1830;--navy2:#060f1f;--navy3:#0e2244;
  --teal:#3fd0c9;--teal2:#7fe3d4;--teal3:#0d5c5c;
  --gold:#e6c468;--gold2:#d4af37;
  --green:#1d9e75;--red:#e24b4a;--gray:#6b7280;--gray2:#9ca3af;
}
*,*::before,*::after{box-sizing:border-box;}
html{background:var(--navy2);}
body{margin:0;min-height:100vh;font-family:'Poppins',sans-serif;color:#fff;
  background:linear-gradient(160deg,#0d1e3a 0%,var(--navy2) 100%);}

/* ── Topbar ─────────────────────────────────────────── */
.tb{display:flex;align-items:center;gap:10px;padding:12px 20px;
  background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);}
.tb img{width:34px;height:34px;border-radius:50%;object-fit:cover;}
.tb .br{font-size:13px;font-weight:700;}
.tb .br .pro{color:var(--teal2);}.tb .br .muf{color:var(--gold);}
.tb .br .sub{display:block;font-size:8.5px;font-weight:400;color:#8ab0c8;margin-top:-1px;letter-spacing:.3px;}

/* ── Wrapper ────────────────────────────────────────── */
.pg{max-width:460px;margin:0 auto;padding:32px 18px 80px;}

/* ── Panel genérico ─────────────────────────────────── */
.panel{animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.ptitle{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px;line-height:1.2;}
.psub{font-size:13px;color:#8ab0c8;text-align:center;margin-bottom:28px;line-height:1.6;}

/* ── Input cédula ───────────────────────────────────── */
.ced-wrap{position:relative;margin-bottom:10px;}
.ced-pre{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:16px;font-weight:700;color:var(--teal2);pointer-events:none;letter-spacing:.5px;}
.ced-in{width:100%;padding:16px 16px 16px 50px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);
  border-radius:14px;color:#fff;font-size:20px;font-weight:700;
  font-family:'Poppins',sans-serif;letter-spacing:1.5px;
  transition:border-color .2s;caret-color:var(--teal);}
.ced-in:focus{outline:none;border-color:var(--teal);}
.ced-in::placeholder{font-weight:400;font-size:15px;color:var(--gray2);letter-spacing:0;}
.ced-hint{font-size:11.5px;color:var(--gray2);text-align:center;margin-bottom:22px;}
.ced-in[aria-invalid="true"]{border-color:var(--red);}

/* ── Botones ────────────────────────────────────────── */
.btn{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
  font-size:14px;font-weight:700;font-family:'Poppins',sans-serif;letter-spacing:.5px;
  transition:opacity .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.97);}.btn:hover{opacity:.88;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-teal{background:linear-gradient(135deg,var(--teal),#1aa39a);color:#fff;
  box-shadow:0 4px 20px rgba(63,208,201,.28);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy2);
  box-shadow:0 4px 20px rgba(230,196,104,.22);}
.btn-ghost{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);
  color:#c8d8ec;margin-top:10px;}

/* ── Spinner ────────────────────────────────────────── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:50vh;gap:16px;text-align:center;}
.spin{width:42px;height:42px;border-radius:50%;
  border:3px solid rgba(63,208,201,.18);border-top-color:var(--teal);
  animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.spin-msg{font-size:14px;color:#8ab0c8;}

/* ── Tarjeta de confirmación ────────────────────────── */
.ok-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
  border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:20px;}
.ok-badge{display:inline-flex;align-items:center;gap:6px;
  background:rgba(29,158,117,.15);border:1px solid rgba(29,158,117,.35);
  color:#5de8b8;font-size:11px;font-weight:700;letter-spacing:1px;
  padding:5px 14px;border-radius:20px;margin-bottom:14px;text-transform:uppercase;}
.ok-name{font-size:20px;font-weight:800;margin-bottom:4px;}
.ok-rol{display:inline-block;background:rgba(63,208,201,.13);border:1px solid var(--teal);
  color:var(--teal2);font-size:11px;font-weight:600;letter-spacing:.8px;
  padding:4px 14px;border-radius:12px;margin-bottom:8px;}
.ok-meta{font-size:11px;color:#7e93ad;line-height:1.8;}

/* ── Zona de foto ───────────────────────────────────── */
.photo-zone{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px;}
.ph-ring{width:120px;height:120px;border-radius:50%;cursor:pointer;position:relative;
  background:linear-gradient(135deg,var(--teal2),var(--teal) 55%,var(--gold));padding:3px;}
.ph-ring:hover .ph-ov{opacity:1;}
.ph-ov{position:absolute;inset:3px;border-radius:50%;background:rgba(6,15,31,.6);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  opacity:0;transition:opacity .2s;}
.ph-in{width:100%;height:100%;border-radius:50%;background:#0c1c33;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
.ph-in img{width:100%;height:100%;object-fit:cover;}
.ph-in svg{width:50%;height:50%;color:#9fb0c8;}
.ph-file{display:none;}
.ph-hint{font-size:12px;color:var(--gray2);text-align:center;line-height:1.6;max-width:260px;}
.ph-hint b{color:var(--teal2);}
.ph-reqs{font-size:11px;color:#5c7a9a;text-align:center;line-height:1.7;margin-top:-6px;}

/* ── Error box ──────────────────────────────────────── */
.err-box{background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.28);
  border-radius:14px;padding:20px;text-align:center;margin-bottom:18px;}
.err-box .eico{font-size:34px;margin-bottom:8px;}
.err-box h3{margin:0 0 6px;font-size:15px;color:#f8807f;}
.err-box p{margin:0;font-size:13px;color:#c8a0a0;line-height:1.5;}

/* ── Carnet ─────────────────────────────────────────── */
.carnet-wrap{display:flex;justify-content:center;margin-bottom:20px;}
/* Proporciones PVC CR80: 54×85.6mm → ratio 0.6308 */
/* En pantalla: 252×400px aprox — se captura con html2canvas scale=3 */
.card{
  width:252px;height:400px;
  background:radial-gradient(circle at 30% 0%,#103a52 0%,#060f1f 55%,#051018 100%);
  border-radius:13px;overflow:hidden;color:#fff;
  font-family:'Poppins',sans-serif;position:relative;
  box-shadow:0 22px 50px -10px rgba(6,15,31,.7),0 6px 16px rgba(6,15,31,.4);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;flex-shrink:0;
}
.card .wm{position:absolute;top:-36px;right:-62px;width:168px;height:173px;
  opacity:.11;transform:rotate(8deg);pointer-events:none;}
.card .inner{position:relative;padding:13px 15px 12px;height:100%;display:flex;flex-direction:column;}
/* Header */
.card .hdr{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
.card .hdr img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.card .hdr .br{font-size:13px;font-weight:800;line-height:1.15;}
.card .hdr .br .pro{color:var(--teal2);}.card .hdr .br .muf{color:var(--gold);}
.card .hdr .br .sub{font-size:6.5px;color:#8ab0c8;font-weight:400;display:block;letter-spacing:.3px;}
/* Glass panel */
.card .gl{background:rgba(255,255,255,.08);border:.3px solid rgba(255,255,255,.22);
  border-radius:11px;padding:14px 12px 12px;flex:1;display:flex;flex-direction:column;align-items:center;}
/* Photo */
.card .cr{width:80px;height:80px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#7fe3d4,#1aa39a 55%,#e6c468);padding:2.5px;margin-bottom:10px;}
.card .ci{width:100%;height:100%;border-radius:50%;background:#0c1c33;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
.card .ci img{width:100%;height:100%;object-fit:cover;}
.card .ci svg{width:52%;height:52%;color:#9fb0c8;}
/* Text */
.card .nm{font-size:14.5px;font-weight:800;text-align:center;line-height:1.2;margin-bottom:4px;}
.card .cd{font-size:9.5px;color:#a9c2d6;letter-spacing:.5px;margin-bottom:9px;}
.card .rp{background:rgba(63,208,201,.16);border:.3px solid #3fd0c9;color:#7fe3d4;
  font-size:10px;font-weight:700;letter-spacing:.5px;padding:4px 13px;
  border-radius:16px;margin-bottom:5px;text-align:center;}
.card .ins{font-size:9px;color:#5de8b8;letter-spacing:.3px;margin-bottom:8px;font-weight:500;}
.card .pr{font-size:8px;color:#7e93ad;letter-spacing:.3px;margin-bottom:auto;}
/* QR */
.card .qa{display:flex;flex-direction:column;align-items:center;margin-top:10px;}
.card .qb{background:#fff;padding:4px;border-radius:7px;width:70px;height:70px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1.5px #3fd0c9,0 0 14px rgba(63,208,201,.4);}
.card .qb img,.card .qb canvas{width:100%!important;height:100%!important;}
.card .qc{font-size:6.5px;color:#7e93ad;letter-spacing:.6px;margin-top:5px;text-align:center;}
.card .ft{margin-top:10px;font-size:7.5px;color:#516781;letter-spacing:1px;
  text-align:center;font-weight:600;}

/* ── Acciones carnet ─────────────────────────────────── */
.carnet-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}

/* ── Nota PDF ────────────────────────────────────────── */
.pdf-note{background:rgba(63,208,201,.07);border:1px solid rgba(63,208,201,.2);
  border-radius:12px;padding:14px 16px;font-size:12px;color:#8ab0c8;line-height:1.7;margin-bottom:16px;}
.pdf-note b{color:var(--teal2);display:block;margin-bottom:4px;}

/* ── PRINT (PDF via window.print) ───────────────────── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body,html{background:white!important;margin:0;padding:0;}
  .tb,.pg .panel>*:not(.carnet-wrap),.carnet-actions,.pdf-note{display:none!important;}
  @page{size:54mm 85.6mm;margin:0;}
  .pg{padding:0;max-width:none;}
  .carnet-wrap{margin:0;}
  .card{
    width:54mm!important;height:85.6mm!important;border-radius:3mm!important;
    box-shadow:none!important;position:fixed;top:0;left:0;
  }
  .card .nm{font-size:3.5mm!important;}
  .card .cd{font-size:2.2mm!important;}
  .card .rp{font-size:2.4mm!important;padding:.8mm 3mm!important;border-radius:3.5mm!important;}
  .card .ins{font-size:2mm!important;}
  .card .pr{font-size:1.9mm!important;}
  .card .hdr{gap:2mm!important;margin-bottom:3mm!important;}
  .card .hdr img{width:7mm!important;height:7mm!important;}
  .card .hdr .br{font-size:3mm!important;}
  .card .hdr .br .sub{font-size:1.5mm!important;}
  .card .inner{padding:3mm 3.5mm 2.5mm!important;}
  .card .gl{border-radius:2.5mm!important;padding:3mm 2.5mm 2.5mm!important;}
  .card .cr{width:18mm!important;height:18mm!important;padding:.5mm!important;margin-bottom:2mm!important;}
  .card .qa{margin-top:2mm!important;}
  .card .qb{width:16mm!important;height:16mm!important;padding:1mm!important;border-radius:1.5mm!important;}
  .card .qc{font-size:1.5mm!important;margin-top:1mm!important;}
  .card .gl{flex:1!important;min-height:0!important;overflow:hidden!important;}
  .card .pr{margin-bottom:0!important;}
  .card .qa{margin-top:auto!important;}
  .card .ft{font-size:1.9mm!important;margin-top:1mm!important;flex-shrink:0!important;}
  .card .wm{top:-8mm!important;right:-14mm!important;width:38mm!important;height:38mm!important;}
}
</style>
</head>

/* ══ STEP 1: Ingresa cédula ═════════════════════════════════════════════════ */
function showStep1(errMsg){
  set([
    '<div class="panel">',
      '<div class="ptitle">Carnetización Digital</div>',
      '<div class="psub">Ingresa tu número de cédula para verificar tu solvencia en PROMUF.</div>',
      errMsg ? '<div class="err-box"><div class="eico">⚠️</div><h3>No pudimos continuar</h3><p>'+esc(errMsg)+'</p></div>' : '',
      '<div class="ced-wrap">',
        '<span class="ced-pre">V-</span>',
        '<input class="ced-in" id="ced" type="tel" placeholder="12.345.678" maxlength="10">',
      '</div>',
      '<p class="ced-hint">Solo el número, sin la V. Ej: 14.545.865</p>',
      '<button class="btn btn-teal" id="btn-verificar">🔍 Verificar solvencia</button>',
    '</div>'
  ].join(''));
  $id('btn-verificar').addEventListener('click', verificar);
  $id('ced').addEventListener('keypress', function(e){
    if(e.key==='Enter') verificar();
  });
  $id('ced').addEventListener('input', function(){ fmtCed(this); });
  setTimeout(function(){ var e=$id('ced'); if(e) e.focus(); }, 80);
}

function fmtCed(el){
  var v = el.value.replace(/\D/g,'').slice(0,8);
  if(v.length > 6){
    v = v.slice(0, v.length-6) + '.' + v.slice(v.length-6, v.length-3) + '.' + v.slice(v.length-3);
  } else if(v.length > 3){
    v = v.slice(0, v.length-3) + '.' + v.slice(v.length-3);
  }
  el.value = v;
}

function validateCed(raw){
  if(!raw) return false;
  return raw.length >= 7 && raw.length <= 8;
}

async function verificar(){
  if(state.busy) return;
  var raw = ($id('ced').value||'').replace(/\D/g,'');
  if(!raw){
    showStep1('Ingresa tu número de cédula.');
    return;
  }
  if(!validateCed(raw)){
    var el = $id('ced');
    if(el) el.setAttribute('aria-invalid','true');
    showStep1('La cédula debe tener entre 7 y 8 dígitos. Verifica e intenta de nuevo.');
    return;
  }
  setBusy(true);
  showLoading('Verificando solvencia en el padrón de PROMUF…');
  try{
    var r = await apiGet({action:'lookup', cedula:'V-'+raw});
    setBusy(false);
    if(!r.success){
      var msgs = {
        no_encontrado:  'Tu cédula no está registrada en el padrón. Contacta a PROMUF para más información.',
        no_solvente:    'Tu membresía no está solvente en este momento. Contacta a PROMUF para regularizarla.',
        cedula_invalida:'Número de cédula inválido. Verifica e intenta de nuevo.'
      };
      showStep1(msgs[r.error] || 'Error inesperado ('+r.error+'). Intenta de nuevo.');
      return;
    }
    state.member = r.member;
    showStep2();
  }catch(ex){
    setBusy(false);
    showStep1('Error de conexión. Verifica tu internet e intenta de nuevo.');
  }
}

/* ══ STEP 2: Subir foto ═════════════════════════════════════════════════════ */
function showStep2(){
  var m = state.member;
  var hasFoto = m.foto_url && m.foto_url.trim();
  var instLine = m.instrumento ? ' · '+esc(m.instrumento) : '';
  set([
    '<div class="panel">',
      '<div class="ok-card">',
        '<div class="ok-badge">✅ Solvente</div>',
        '<div class="ok-name">'+esc(m.nombre)+'</div>',
        '<div class="ok-rol">'+esc(m.cargo)+instLine+'</div>',
        '<div class="ok-meta">'+esc(m.cedula)+' &nbsp;·&nbsp; '+esc(m.id)+'<br>Período '+esc(m.periodo_inicio)+' – '+esc(m.periodo_fin)+'</div>',
      '</div>',
      '<div class="ptitle" style="font-size:18px;margin-bottom:6px;">Sube tu foto de carnet</div>',
      '<div class="psub" style="margin-bottom:20px;">',
        hasFoto ? 'Ya tienes una foto guardada. Puedes usarla o subir una nueva.' :
                  'Esta foto aparecerá en tu carnet imprimible.',
      '</div>',
      '<div class="photo-zone">',
        '<div class="ph-ring" id="ph-ring">',
          '<div class="ph-ov">📷</div>',
          '<div class="ph-in" id="ph-prev">',
            hasFoto ? '<img src="'+esc(m.foto_url)+'" crossorigin="anonymous">' : AV,
          '</div>',
        '</div>',
        '<div class="ph-hint">',
          hasFoto ? 'Haz clic para <b>cambiar la foto</b>.<br>O continúa con la que ya tienes.' :
                    'Haz clic en el círculo para <b>seleccionar tu foto</b>.<br>Se recortará automáticamente.',
        '</div>',
        '<div class="ph-reqs">📐 Foto de frente, fondo claro, rostro centrado<br>Formatos: JPG, PNG · Máx 10 MB</div>',
        '<input type="file" id="ph-file" accept="image/*" class="ph-file">',
      '</div>',
      '<button class="btn btn-gold" id="btn-continuar">',
        hasFoto ? '🎫 Generar carnet con foto guardada' : '🎫 Generar carnet',
      '</button>',
      '<button class="btn btn-ghost" id="btn-volver">← Volver</button>',
    '</div>'
  ].join(''));
  $id('ph-ring').addEventListener('click', function(){ $id('ph-file').click(); });
  $id('ph-file').addEventListener('change', onFoto);
  $id('btn-continuar').addEventListener('click', step2Continuar);
  $id('btn-volver').addEventListener('click', function(){ showStep1(); });
  if(hasFoto){ state.photoSrc = m.foto_url; state.photoB64 = null; }
}

function onFoto(evt){
  var file = evt.target.files[0];
  if(!file) return;
  if(file.size > 10*1024*1024){ alert('La foto es muy grande. Máximo 10 MB.'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    cropResize(e.target.result, function(b64, src){
      state.photoB64 = b64;
      state.photoSrc = src;
      var prev = $id('ph-prev');
      if(prev){ prev.innerHTML = '<img src="'+src+'">'; }
      var btn = $id('btn-continuar');
      if(btn){ btn.textContent = '🎫 Generar carnet'; }
    });
  };
  reader.readAsDataURL(file);
}

function cropResize(dataUrl, cb){
  var img = new Image();
  img.onload = function(){
    var sz = Math.min(img.width, img.height);
    var sx = (img.width-sz)/2, sy = (img.height-sz)/2;
    var faceOffset = Math.min(sz*0.08, sy);
    sy = Math.max(0, sy - faceOffset);
    var c = document.createElement('canvas');
    c.width = c.height = 520;
    c.getContext('2d').drawImage(img,sx,sy,sz,sz,0,0,520,520);
    var src = c.toDataURL('image/jpeg', 0.9);
    cb(src.split(',')[1], src);
  };
  img.src = dataUrl;
}

async function step2Continuar(){
  if(state.busy) return;
  var m = state.member;
  if(!state.photoB64 && !state.photoSrc){
    alert('Por favor selecciona una foto antes de continuar.');
    return;
  }
  setBusy(true);
  if(state.photoB64){
    showLoading('Guardando tu foto en el sistema…');
    try{
      var r = await apiPost({action:'savefoto', id:m.id, foto:state.photoB64});
      if(!r.success){
        setBusy(false);
        showError('No se pudo guardar la foto. Intenta de nuevo.', showStep2);
        return;
      }
      state.member.foto_url = r.foto_url;
      state.photoSrc = r.foto_url;
    }catch(ex){
      setBusy(false);
      showError('Error de conexión al guardar la foto. Intenta de nuevo.', showStep2);
      return;
    }
  }
  setBusy(false);
  showStep3();
}

/* ══ STEP 3: Carnet + Descarga ══════════════════════════════════════════════ */
function showStep3(){
  var m = state.member;
  var perfilUrl = PERFIL_BASE + encodeURIComponent(m.id);
  var foto = state.photoSrc || '';
  var fotoHtml = foto ? '<img src="'+esc(foto)+'" crossorigin="anonymous" alt="">' : AV;
  var inst = m.instrumento ? '<div class="ins">'+esc(m.instrumento)+'</div>' : '';

  set([
    '<div class="panel">',
      '<div class="ptitle">¡Tu carnet está listo!</div>',

              '</div>',
            '</div>',
            '<div class="gl">',
              '<div class="cr"><div class="ci" id="card-foto">'+fotoHtml+'</div></div>',
              '<div class="nm">'+esc(m.nombre)+'</div>',
              '<div class="cd">'+esc(m.cedula)+'</div>',
              '<div class="rp">'+esc(m.cargo)+'</div>',
              inst,
              '<div class="pr">PERÍODO '+esc(m.periodo_inicio)+' — '+esc(m.periodo_fin)+'</div>',
              '<div class="qa">',
                '<div class="qb" id="qr-box"></div>',
                '<div class="qc">VERIFICAR MEMBRESÍA</div>',

            '</div>',
            '<div class="ft">'+esc(m.id)+' &nbsp;·&nbsp; PROMUF</div>',

        '<button class="btn btn-ghost" id="btn-perfil">👁 Ver perfil público</button>',
        '<button class="btn btn-ghost" id="btn-nuevo">🔄 Generar otro carnet</button>',

  ].join(''));

  $id('btn-pdf').addEventListener('click', function(){ window.print(); });
  $id('btn-perfil').addEventListener('click', function(){ window.open(perfilUrl,'_blank'); });
  $id('btn-nuevo').addEventListener('click', function(){ showStep1(); });

  requestAnimationFrame(function(){
    var el = $id('qr-box');
    if(el && window.QRCode){
      new QRCode(el,{text:perfilUrl,width:200,height:200,
        colorDark:'#0a1830',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
    }
  });
}

/* ══ Helpers ════════════════════════════════════════════════════════════════ */
function showLoading(msg){
  set('<div class="loading"><div class="spin"></div><div class="spin-msg">'+esc(msg)+'</div></div>');
}

function showError(msg, backFn){
  set([
    '<div class="panel">',
      '<div class="err-box">',
        '<div class="eico">⚠️</div>',
        '<h3>Algo salió mal</h3>',
        '<p>'+esc(msg)+'</p>',
      '</div>',
      '<button class="btn btn-ghost" id="btn-back-error">← Volver</button>',
    '</div>'
  ].join(''));
  $id('btn-back-error').addEventListener('click', backFn);
}

async function apiGet(params){
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  }).join('&');
  var r = await fetch(API+'?'+qs, {redirect:'follow'});
  return r.json();
}

async function apiPost(data){
  var r = await fetch(API, {
    method:'POST', redirect:'follow',
    body: JSON.stringify(data)
  });
  return r.json();
}

showStep1();
